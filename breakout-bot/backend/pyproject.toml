[project]
name = "breakout-bot"
version = "1.0.0"
description = "Bot de trading crypto « Breakout Swing » — backtest fiable, paper trading, paramétrage FR"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "ccxt>=4.3",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "websockets>=12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests longs (performance), exclus du run par défaut",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["ccxt.*", "apscheduler.*", "pyarrow.*", "pandas.*"]
ignore_missing_imports = true
